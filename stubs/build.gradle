plugins {
    id 'java-library'
    id 'maven-publish'
}

java {
    disableAutoTargetJvm()
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.named('compileJava') {
    dependsOn 'assembleJasmin'
}

def jasminSourceDir = file('src/main/jasmin')
def jasminJar = rootProject.file('compatibility/tools/jasmin.jar')
def jasminOutDir = layout.buildDirectory.dir('classes/jasmin')

tasks.register('assembleJasmin', JavaExec) {
    mainClass = 'jasmin.Main'
    classpath = files(jasminJar)
    workingDir jasminSourceDir

    def sourceTree = fileTree(dir: jasminSourceDir, include: '**/*.j')
    def sources = sourceTree.files.collect { jasminSourceDir.toPath().relativize(it.toPath()).toString() }

    def outDir = jasminOutDir.get().asFile
    args = ['-d', outDir.absolutePath] + sources

    inputs.files(sourceTree, jasminJar)
    outputs.dir(jasminOutDir)
}

sourceSets {
    main {
        java.setSrcDirs([])
        output.dir(jasminOutDir, builtBy: 'assembleJasmin')
        // Gradle only exposes project :stubs on compile classpath via classesDirs, not extra output.dir alone.
        output.classesDirs.from(jasminOutDir)
        output.classesDirs.builtBy('assembleJasmin')
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}